<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1d4ed8" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded app squircle -->
  <rect width="192" height="192" rx="42" fill="#0f172a" />
  <rect x="8" y="8" width="176" height="176" rx="36" fill="url(#blueGrad)" filter="url(#glow)" />

  <!-- Smart Home Remote Logo (House + Wireless Remote waves + Power Dot) -->
  <g fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Roof & House body -->
    <path d="M52 86 L96 48 L140 86" />
    <path d="M62 82 L62 134 C62 138 66 142 70 142 L122 142 C126 142 130 138 130 134 L130 82" />
    
    <!-- Smart Remote Signal Arc -->
    <path d="M80 88 A24 24 0 0 1 112 88" stroke-width="6" stroke="#93c5fd" />
    <path d="M72 74 A36 36 0 0 1 120 74" stroke-width="6" stroke="#bfdbfe" opacity="0.8" />
  </g>

  <!-- Power status indicator core -->
  <circle cx="96" cy="114" r="8" fill="#22c55e" />
</svg>
